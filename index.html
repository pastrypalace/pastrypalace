<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="resources/fav.png" />
  <!-- credit: https://www.iconarchive.com/show/love-is-in-the-web-icons-by-succodesign/heart-icon.html#google_vignette for favicon -->
  <title>Valentines Interactive</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    /* Background styles */
    .video-background {
      background-image: url('https://i.kym-cdn.com/photos/images/newsfeed/002/738/959/060.gif');
      background-size: cover;
      background-position: center;
      height: 100vh;
      width: 100%;
      position: fixed; /* background fixed */
      top: 0;
      left: 0;
      z-index: -1; /* behind content */
    }

    /* Centering container styles */
    .container {
      position: relative;
      z-index: 1;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center; /* vertical centering */
      align-items: center; /* horizontal centering */
      text-align: center; /* center text inside elements */
    }

    /* Optional: style for buttons */
    .yes-no {
      margin-top: 20px;
      display: flex;
      gap: 20px; /* space between buttons */
      justify-content: center;
    }
  </style>
</head>
<body>
  <section>
    <!-- Background GIF -->
    <div class="video-background"></div>
    
    <!-- Main centered container -->
    <div class="container">
      <div class="image-box">
        <div class="actual-image">
          <img src="resources/cat-heart.gif" alt="gif" class="gif" id="gif" />
          <!-- gif credit: https://tenor.com/view/heart-love-cat-kawaii-cute-gif-8446829684698946759 -->
        </div>
        <div class="text-one">
          <p style="font-size: 1.4rem;" id="text">Main Question text</p>
        </div>
      </div>
      
      <!-- Buttons centered -->
      <div class="yes-no">
        <button class="yes" id="yes">Yes</button>
        <button class="no" id="no">No</button>
      </div>
    </div>
  </section>
  <script src="js/app.js"></script>
</body>
</html>
