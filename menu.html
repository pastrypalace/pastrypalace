<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menu - Pastry Palace</title>
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      margin: 0;
      background-color: #fff5e1;
      color: #4b2e05;
    }

    header, footer {
      background-color: #d4a373;
      color: white;
      text-align: center;
      padding: 20px 0;
    }

    header h1 {
      font-family: 'Pacifico', cursive;
      margin: 0;
      font-size: 2.5em;
    }

    nav {
      background-color: #b07a3f;
      display: flex;
      justify-content: center;
      gap: 25px;
      padding: 10px;
    }

    nav a {
      color: #fff5e1;
      text-decoration: none;
      font-weight: bold;
    }

    nav a:hover {
      color: #ffeccc;
    }

    section {
      padding: 40px 10%;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    /* Side images */
    .side-image {
      position: absolute;
      top: 0;
      width: 260px;
      height: 100%;
      object-fit: cover;
      opacity: 0.25;
      z-index: -1;
    }
